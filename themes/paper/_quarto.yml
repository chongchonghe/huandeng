# Deck configuration, in the paper theme — see themes/README.md.
#
# Deck configuration. This is the analogue of `main.typ` in the Typst decks:
# every option that shapes the whole deck lives here, and the slides live in the
# .qmd next to it. A talk's own title, author, date and footer stay in the .qmd,
# because that is where Quarto expects a document's identity to live.
#
# Everything this deck needs is inside this folder — theme, fonts, assets — so
# the folder can be copied anywhere and still render the same way.

project:
  type: default
  output-dir: out
  # Quarto only auto-discovers inputs when it is told which ones to look at.
  render:
    - "*.qmd"
  # Copied next to the rendered HTML whether or not a slide happens to reference
  # them. `fonts/` is only ever reached from theme.scss, which Quarto does not
  # scan, so it would otherwise be left behind and the deck would fall back to a
  # different typeface on any machine without Fira Sans installed.
  resources:
    - fonts/
    - attach/

# The title slide stands on the deck's own background, like every other slide.
# For a field of colour behind it, uncomment the two lines below.
#
# It has to be set here rather than in theme.scss: reveal paints slide
# backgrounds on a layer of its own, behind and outside the 4% margin, and CSS
# on the <section> only ever reaches inside that margin. Any slide can do the
# same with `## Title {background-color="#0a6ebd"}`. If you turn it on, put the
# title type back to something that reads on it — theme.scss sets it in the
# deck's own ink, for a title slide the same colour as the rest of the deck.
#
# title-slide-attributes:
#   data-background-gradient: "linear-gradient(135deg, #072f4f 0%, #0a6ebd 65%, #2e97db 100%)"

format:
  revealjs:
    theme: [default, theme.scss]
    include-in-header:
      # The deck's own copy of Fira Sans, and the layout guides on X.
      # See the comment at the top of each file.
      - fonts.html
      - guides.html
    # A logo on every slide, top right. Quarto copies the file next to the
    # HTML and writes an <img class="slide-logo">; theme.scss positions it.
    # It has to be set here rather than as a background in theme.scss — a
    # relative url() there resolves against the compiled stylesheet, five
    # directories down, and quietly 404s. Same reason the fonts are in
    # fonts.html.
    # logo: attach/logo.png
    width: 1280
    height: 720
    # The fraction of the window left empty around the slide, in total — half
    # on each side. 0.04 is 2% a side: at 1920x1080 that is a 38px border left
    # and right, 22px top and bottom.
    margin: 0.04
    # Reveal refuses to scale a slide past 2x by default, so on a window wider
    # than 2560 CSS px the deck stops growing and sits in a broad empty border
    # that no `margin` setting will close. Nothing here is a bitmap, so there is
    # no reason to cap it that low.
    max-scale: 5
    # `=` in Typst, `#` here: a level-1 heading starts a section, a level-2
    # heading starts a slide.
    slide-level: 2
    center: false
    auto-stretch: false
    slide-number: c/t
    progress: true
    history: true
    hash-type: number
    transition: none
    highlight-style: printing
    # Line numbers only on the blocks that ask for them with
    # `{.python code-line-numbers="1-2|4"}`, not on every listing.
    code-line-numbers: false
    fig-align: center
    # How many slides ahead reveal builds; 3 is enough for the presenter view's
    # next-slide pane without loading every video at once.
    view-distance: 3
    lang: en
