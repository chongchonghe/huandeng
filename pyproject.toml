[project]
name = "huandeng"
version = "0.1.0"
description = "Academic slide decks in plain text, on Quarto and reveal.js"
requires-python = ">=3.13"
dependencies = [
    # Drives a headless Chromium: the PDF, the per-slide PNGs, and every check.
    # A browser is not optional here — the deck's layout is CSS, so nothing else
    # can tell you where a slide's content actually landed.
    "playwright>=1.49.0",
    # Rasterises PDF pages into the PPTX.
    "pymupdf>=1.28.0",
    "python-pptx>=1.0.2",
]

# After `uv sync`, fetch the browser once:
#     uv run playwright install chromium
