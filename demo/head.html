<!-- Everything Quarto injects into the deck's <head>, listed by
     `include-in-header` in _quarto.yml. Two unrelated things, each explained
     above its own block. -->

<!-- 1. The deck's own copy of Fira Sans.

     These rules cannot live in a stylesheet. Quarto compiles the theme into
     <deck>_files/libs/revealjs/dist/theme/, five directories deep, and a
     relative url() inside a stylesheet resolves against the stylesheet's own
     location — so "fonts/FiraSans-Regular.otf" written there would be looked
     for next to reveal's own theme files and quietly 404.

     A <style> element in the document resolves url() against the *document*,
     which is out/<deck>.html, and out/fonts/ is exactly where _quarto.yml's
     `resources:` puts these files. Hence this file.

     The failure this prevents is silent: the deck still renders, in whatever
     sans-serif the machine happens to have, at different metrics, and every
     line breaks somewhere else. -->
<style>
  @font-face {
    font-family: "Fira Sans";
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url("fonts/FiraSans-Regular.otf") format("opentype");
  }
  @font-face {
    font-family: "Fira Sans";
    font-style: italic;
    font-weight: 400;
    font-display: block;
    src: url("fonts/FiraSans-Italic.otf") format("opentype");
  }
  @font-face {
    font-family: "Fira Sans";
    font-style: normal;
    font-weight: 500;
    font-display: block;
    src: url("fonts/FiraSans-Medium.otf") format("opentype");
  }
  @font-face {
    font-family: "Fira Sans";
    font-style: italic;
    font-weight: 500;
    font-display: block;
    src: url("fonts/FiraSans-MediumItalic.otf") format("opentype");
  }
  @font-face {
    font-family: "Fira Sans";
    font-style: normal;
    font-weight: 600;
    font-display: block;
    src: url("fonts/FiraSans-SemiBold.otf") format("opentype");
  }
  @font-face {
    font-family: "Fira Sans";
    font-style: normal;
    font-weight: 700;
    font-display: block;
    src: url("fonts/FiraSans-Bold.otf") format("opentype");
  }
  @font-face {
    font-family: "Fira Sans";
    font-style: italic;
    font-weight: 700;
    font-display: block;
    src: url("fonts/FiraSans-BoldItalic.otf") format("opentype");
  }
</style>

<!-- 2. Layout guides, on the X key.

     Press X while the deck is open, or load it with ?guides in the URL.

     Every slide is laid out in a box of exactly the pixel size set in
     _quarto.yml — 1280 x 720 — which is then scaled uniformly to whatever
     screen it is shown on. Reveal draws that box but does not outline it, and
     it neither clips nor shrinks content that does not fit: the surplus hangs
     into the small margin reveal keeps around the box and is then cut off by
     the window edge. How much survives depends on the window's aspect ratio,
     which is why a slide can look merely tight on a 16:10 laptop and be cut on
     a 16:9 projector.

     These guides make the box visible while you write. The solid line is that
     hard boundary; the dashed line is a keep-clear inset, because content that
     kisses the edge reads as a mistake even when it technically fits.

     `make check` is the version of this that does not rely on you looking. -->
<script>
  (function () {
    var root = document.documentElement;

    function toggle(on) {
      if (on === undefined) on = !root.hasAttribute("data-guides");
      if (on) root.setAttribute("data-guides", "");
      else root.removeAttribute("data-guides");
    }

    // How far down the slide box the current slide's content actually reaches.
    // Empty space here is the commonest reason a deck "does not fill the
    // screen", and it is the one no reveal setting can fix.
    function fill(box, scale) {
      var slide = Reveal.getCurrentSlide();
      if (!slide) return null;
      var bottom = -Infinity;
      var all = slide.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        var cs = getComputedStyle(el);
        if (cs.display === "none" || cs.visibility === "hidden") continue;
        if (el.closest("aside.notes")) continue;
        var r = el.getBoundingClientRect();
        if (r.width < 1 || r.height < 1) continue;
        if (r.bottom > bottom) bottom = r.bottom;
      }
      if (bottom === -Infinity) return null;
      return Math.round(((bottom - box.top) / scale / Reveal.getConfig().height) * 100);
    }

    // Everything in the label is read back from the live deck, so it cannot
    // drift from _quarto.yml the way a hard-coded string would. It is also the
    // quickest way to tell the three causes of a too-small deck apart: a scale
    // at the cap, a window that is not 16:9, or a slide that is simply empty.
    function relabel() {
      var cfg = Reveal.getConfig();
      var box = document.querySelector(".reveal .slides").getBoundingClientRect();
      var win = document.querySelector(".reveal").getBoundingClientRect();
      var scale = Reveal.getScale();
      var parts = [cfg.width + " × " + cfg.height];
      parts.push("window " + Math.round(win.width) + " × " + Math.round(win.height));
      parts.push("ar " + (win.width / win.height).toFixed(2));
      parts.push("scale " + scale.toFixed(2));
      var uncapped =
        (Math.min(win.width / cfg.width, win.height / cfg.height) * (1 - cfg.margin));
      if (uncapped > scale + 1e-6) parts.push("CAPPED by max-scale " + cfg.maxScale);
      var f = fill(box, scale);
      if (f !== null) parts.push("fill " + f + "%");
      root.style.setProperty("--guide-label", '"' + parts.join("  ·  ") + '"');
    }

    function install() {
      relabel();
      ["slidechanged", "resize", "fragmentshown", "fragmenthidden"].forEach(
        function (ev) { Reveal.on(ev, relabel); }
      );
      if (/[?&]guides(\b|=)/.test(location.search)) toggle(true);
      // addKeyBinding rather than a bare keydown listener: reveal then lists it
      // in its own help overlay (?) and it cannot collide with navigation.
      // X, because G is already reveal's jump-to-slide.
      Reveal.addKeyBinding(
        { keyCode: 88, key: "X", description: "Toggle layout guides" },
        function () { toggle(); }
      );
    }

    // Quarto initialises Reveal from a script at the end of <body>, so there is
    // nothing to hook yet when this runs. Wait for it, and give up rather than
    // poll forever if the deck failed to load.
    var tries = 0;
    var timer = setInterval(function () {
      if (window.Reveal && Reveal.isReady && Reveal.isReady()) {
        clearInterval(timer);
        install();
      } else if (++tries > 100) {
        clearInterval(timer);
      }
    }, 100);
  })();
</script>
